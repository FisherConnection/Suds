name: Build and Publish SUDS PRO v1.2.23 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Reassemble, verify and compile fresh SUDS PRO APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout locked source
        uses: actions/checkout@v4

      - name: Reassemble source and verify SHA-256 before Gradle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find suds_pro_source_parts -maxdepth 1 -type f -name 'part-*.bin' | wc -l)" -eq 24
          cat suds_pro_source_parts/part-*.bin > SUDS_PRO_v1.2.23_source.zip
          echo "be6090ca30f3b1f8c605bb43c1dc0d770acd3adfddd355c61847fcc3baf897dd  SUDS_PRO_v1.2.23_source.zip" | sha256sum -c -
          unzip -tq SUDS_PRO_v1.2.23_source.zip
          mkdir -p suds_pro_v1223
          unzip -q SUDS_PRO_v1.2.23_source.zip -d suds_pro_v1223
          test -f suds_pro_v1223/app/src/main/assets/app.js
          test "$(find suds_pro_v1223/app/src/main/assets/ads -name 'SUDS_APPROVED_*.png' | wc -l)" -eq 13

      - name: Apply verified visual and cleaning corrections
        shell: bash
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 build-tools/patch_v1223.py suds_pro_v1223

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and ensure Android 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile clean Android APK (no old binaries)
        working-directory: suds_pro_v1223
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify built APK exists
        run: |
          test -s suds_pro_v1223/app/build/outputs/apk/debug/app-debug.apk
          unzip -tq suds_pro_v1223/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload new installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SUDS-PRO-v1.2.23-FRESH-ANDROID-APK
          path: suds_pro_v1223/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to public GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cp suds_pro_v1223/app/build/outputs/apk/debug/app-debug.apk SUDS-PRO-v1.2.23.apk
          sha256sum SUDS-PRO-v1.2.23.apk > SUDS-PRO-v1.2.23.sha256
          if gh release view v1.2.23 >/dev/null 2>&1; then
            gh release upload v1.2.23 SUDS-PRO-v1.2.23.apk SUDS-PRO-v1.2.23.sha256 --clobber
          else
            gh release create v1.2.23 SUDS-PRO-v1.2.23.apk SUDS-PRO-v1.2.23.sha256 --title "SUDS PRO v1.2.23 Android" --notes "Official GitHub Android test build. Physical-device functionality and video export remain unverified."
          fi
